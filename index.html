    // 已填入你的專屬 Google Apps Script Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXQSeuHPvHPNNeWJ5mM5dp9y6Mxh_eCR5HAk1085yPbfN7_U5XF5n5IXgre2pd4saBPw/exec";

    const questions = [
        {
            text: "Q1. 放學時，你同班朋友去旺角食飯。出地鐵站嗰陣，突然發現其中一個朋友唔見咗，電話又無人聽。呢個時候，你第一時間會點做？",
            options: [
                { id: "A", text: "主動安撫其他慌張嘅朋友，並提議去大家最常去嘅幾間店舖搵下，用溫暖同細心令大家冷靜落嚟。" },
                { id: "B", text: "叫大家留喺原地唔好亂走，自己立刻行去地鐵站客務中心，請職員廣播，並喺腦海迅速規劃最有效率嘅搵人路線。" },
                { id: "C", text: "開啟手機嘅「尋找朋友」或檢查邊個最後見過佢，計算時間同距離，推測佢最有可能卡喺邊個轉車站。" },
                { id: "D", text: "觀察地鐵站出口嘅人流方向同地圖，分析呢個站嘅人流盲點，判斷佢係咪行錯咗去其他連接商場嘅出口。" }
            ]
        },
        {
            text: "Q2. 學校年園遊會(School Bazaar)輪到你哋班擺攤位，大家推舉你做核心負責人。你最想負責以下邊個工作崗位？",
            options: [
                { id: "A", text: "攤位前線嘅接待員兼PR！著起班衫，用最親切嘅笑容同叫座力吸引全校師生過嚟幫襯，確保每位顧客都玩得開心。" },
                { id: "B", text: "現場總指揮！負責監督排隊人流、控制遊戲器材有冇故障，隨時處理現場突發情況(例如有人打尖或倒瀉飛排)。" },
                { id: "C", text: "後勤及物資採購官！精準計算要買幾多原材料、搵邊間批發最平、貨物點樣最快運到學校，確保攤位絕對唔會斷貨。" },
                { id: "D", text: "攤位總策劃師！負責研究全校攤位嘅分佈圖，分析邊個位置最好人流、設計最吸睛嘅攤位主題同長遠嘅宣傳策略。" }
            ]
        },
        {
            text: "Q3. 暑假你同屋企人或者朋友去海外自由行，由你負責編排全個行程。你嘅「排行程風格」最接近以下邊一種？",
            options: [
                { id: "A", text: "精選當地最熱門嘅打卡 Cafe、米芝蓮餐廳或者精緻體驗活動，確保同行嘅所有人行程中都覺得被照顧得無微不至。" },
                { id: "B", text: "行程唔使太密，但每個景點之間嘅「交通接駁時間」一定要預留後備方案(例如萬一班車遲到點辦)，確保行程極度流暢。" },
                { id: "C", text: "行程路線絕對唔走回頭路！精確計算行李箱限重、買手信嘅寄送方法，用最短嘅行車/行路路線去到最多目的地。" },
                { id: "D", text: "比起普通景點，更想去體驗當地獨特嘅交通工具(如雙層巴士、新幹線、纜車)，觀察人哋嘅城市同交通網絡點解規劃得咁好。" }
            ]
        },
        {
            text: "Q4. 距離 JUPAS/E-App 選科截止仲有最後一日，你發現自己仲有3個學分/選修志願未填滿，此時你對未來大學生活最大嘅期望係乜？",
            options: [
                { id: "A", text: "希望修讀有得著專業制服、著重人際溝通、畢業後可以直接接觸世界各地不同文化旅客嘅實用學科。" },
                { id: "B", text: "希望學習點樣管理一個大型國際地標(如世界級機場)嘅運作，享受喺幕後掌控全盤大局、指揮若定嘅成功感。" },
                { id: "C", text: "希望掌握網購、全球物資流轉背後嘅高科技大數據商務知識，畢業後加入高薪、高前途嘅國際物流管理行業。" },
                { id: "D", text: "希望擁有最廣闊嘅視野，研究全球交通運輸體系、航空公司管理與航空政策，成為未來交通界嘅策略與規劃人才。" }
            ]
        }
    ];

    const resultsData = {
        "A": {
            illustration: "👩‍✈️ ☕ ✨",
            title: "【空服極限 Carry 俠】",
            discipline: "(航空機艙及客運服務)",
            desc: "天生具備神級的情商(EQ)與讀心術！就算遇到瘋狂投訴的奧客，你都能面帶微笑、優雅地用一杯熱茶化解危機。在空中飛行的世界裡，你就是全機乘客的安全感來源。",
            highlight: "💡 Programme Code: BA114057\n想體驗模擬機艙實習？這科就是你的首選！"
        },
        "B": {
            illustration: "🏢 🎧 🧠",
            title: "【上帝視角：塔台指揮官】",
            discipline: "(機場營運管理)",
            desc: "天生自帶超強大腦與抗壓能力！擅長在混亂中理出頭緒，就算機場有 100 班航機同時起降、天氣突變，你都能冷靜調度。你是掌控整個機場運作的核心大腦。",
            highlight: "💡 Programme Code: BA114107\n想學習世界級機場的營運與危機處理？來這裡就對了。"
        },
        "C": {
            illustration: "📦 🌍 🚚",
            title: "【環球物資傳送門】",
            discipline: "(航空及物流)",
            desc: "擁有最強的空間感與時間管理能力！網購的iPhone 點樣最快由工廠送到你手上？疫苗點樣在低溫下安全跨國運送？全靠你的精準計算。你是鏈接全球經濟的幕後黑手。",
            highlight: "💡 Programme Code: BA114056\n結合大數據與全球供應鏈，是全港極缺人才的高薪行業！"
        },
        "D": {
            illustration: "🗺️ 🚅 🏙️",
            title: "【未來交通規劃大師】",
            discipline: "(航空服務及運輸學)",
            desc: "充滿好奇心與宏觀視野的策略家。比起單一崗位，你更喜歡研究整條航線、公共交通網絡的規劃。高瞻遠矚，未來的航空政策與運輸大局將由你來改寫！",
            highlight: "💡 Programme Code: BA114058\n出路最廣闊，涵蓋航空諮詢、政府運輸部門及大型交通機構。"
        }
    };

    let currentQuestionIndex = 0;
    let answers = [];
    let currentResult = null;

    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        setTimeout(() => {
            document.getElementById(id).classList.add('active');
        }, 50);
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        answers = [];
        showSection('quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('question-progress').innerText = `🚩 任務進度： ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 

        q.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt.text;
            btn.onclick = function() { selectOption(opt.id, this); };
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(id, element) {
        if (document.querySelector('.option.selected')) return;

        element.classList.add('selected');
        answers.push(id);

        setTimeout(() => {
            const quizSection = document.getElementById('quiz');
            quizSection.classList.add('fade-out');

            setTimeout(() => {
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion();
                    quizSection.classList.remove('fade-out');
                } else {
                    quizSection.classList.remove('fade-out');
                    calculateResult();
                }
            }, 400);
        }, 700);
    }

    function calculateResult() {
        const counts = answers.reduce((acc, val) => {
            acc[val] = (acc[val] || 0) + 1;
            return acc;
        }, {});

        let maxCount = 0;
        let finalResultId = 'A';

        for (const [key, value] of Object.entries(counts)) {
            if (value > maxCount) {
                maxCount = value;
                finalResultId = key;
            }
        }
        renderResult(finalResultId);
    }

    function renderResult(id) {
        currentResult = resultsData[id];
        document.getElementById('result-illustration').innerText = currentResult.illustration;
        document.getElementById('result-title').innerText = currentResult.title;
        document.getElementById('result-discipline').innerText = currentResult.discipline;
        document.getElementById('result-desc').innerText = currentResult.desc;
        document.getElementById('result-highlight').innerText = currentResult.highlight;
        
        showSection('result');
    }

    // 發送資料至 Google Sheets 函數
    function submitRecord() {
        const userName = document.getElementById('user-name').value.trim();
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        // 已移除會誤判的 if 檢查

        submitBtn.disabled = true;
        statusMsg.style.color = "#E67E22";
        statusMsg.innerText = "正在傳送資料...";

        const payload = {
            name: userName || "匿名玩家",
            title: currentResult.title,
            discipline: currentResult.discipline
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMsg.style.color = "#27AE60";
            statusMsg.innerText = "✅ 記錄已成功上傳資料庫！";
            submitBtn.innerText = "已提交";
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.style.color = "#C0392B";
            statusMsg.innerText = "❌ 傳送失敗，請稍後再試。";
            submitBtn.disabled = false;
        });
    }
</script>
