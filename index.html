<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 航空學分特訓基地：未來機組人員相性測驗</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        :root {
            --primary-color: #D35400; /* 溫暖的橘紅色 */
            --accent-color: #FF7E5F;  /* 珊瑚紅 */
            --bg-gradient: linear-gradient(135deg, #FFF3E0 0%, #FFEFBA 100%); /* 奶茶/陽光漸層 */
            --card-bg: #FFFFFF;
            --text-color: #5D4037;    /* 暖咖啡色 */
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(211, 84, 0, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 3px solid #FFE0B2;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .subtitle {
            color: #E67E22;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* 互動式暖色按鍵 */
        .btn {
            background: linear-gradient(45deg, #FF7E5F, #FEB47B);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 126, 95, 0.6);
            background: linear-gradient(45deg, #FEB47B, #FF7E5F);
        }

        /* 題目選項設計 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .option {
            background-color: #FAFAFA;
            border: 2px solid #FFE0B2;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4E342E;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            border-color: var(--accent-color);
            background-color: #FFF9F2;
            transform: translateX(10px);
            box-shadow: -5px 5px 15px rgba(211, 84, 0, 0.08);
        }

        /* 被選中時的過場效果 */
        .option.selected {
            background: linear-gradient(120deg, #FF7E5F, #FEB47B);
            color: white;
            border-color: transparent;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(255, 126, 95, 0.3);
            pointer-events: none; /* 防止連點 */
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #C0392B;
            line-height: 1.6;
            text-align: left;
        }

        .section {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(20px);
        }

        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 用於換題的淡出效果 */
        .fade-out {
            opacity: 0 !important;
            transform: translateY(-20px) !important;
        }

        /* 華麗的測驗結果卡片設計 */
        .result-card {
            background: linear-gradient(135deg, #FFF9F2 0%, #FFE0B2 100%);
            padding: 40px 30px;
            border-radius: 20px;
            margin-top: 20px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.8), 0 10px 30px rgba(211,84,0,0.15);
            border: 2px dashed #FFB74D;
        }

        .illustration-box {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .result-title {
            font-size: 2.2rem;
            color: #C0392B;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .result-discipline {
            font-size: 1.3rem;
            color: #E67E22;
            font-weight: bold;
            margin-bottom: 25px;
            background: #FFF;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .result-desc {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: justify;
            font-weight: 500;
        }

        .highlight-box {
            background: linear-gradient(to right, #ffffff, #FFF3E0);
            border-left: 6px solid var(--accent-color);
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
            color: #D35400;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            text-align: left;
        }

        /* 動畫設定 */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 首頁 -->
    <div id="intro" class="section active">
        <h1>2026 航空學分特訓基地</h1>
        <div class="subtitle">✨ 未來機組人員相性測驗 ✨</div>
        <div style="font-size: 4rem; margin-bottom: 10px; animation: float 3s ease-in-out infinite;">✈️ ☁️ 🧳</div>
        <p style="margin-bottom: 30px; line-height: 1.8; color: #6D4C41; font-weight: bold; font-size: 1.1rem;">
            你擁有哪一種隱藏的航空天賦？<br>
            透過 4 條日常情境題，測出你最終的「航空職人命格」！
        </p>
        <button class="btn" onclick="startQuiz()">開始測驗</button>
    </div>

    <!-- 測驗頁面 -->
    <div id="quiz" class="section">
        <div id="question-progress" style="text-align: left; color: #E67E22; margin-bottom: 15px; font-weight: 900; font-size: 1.1rem;"></div>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options-container">
            <!-- 選項會透過 JS 動態生成 -->
        </div>
    </div>

    <!-- 結果頁面 -->
    <div id="result" class="section">
        <h1 style="font-size: 1.8rem; color: #5D4037;">你的專屬航空職人命格是...</h1>
        <div class="result-card">
            <!-- 手繪風/Fancy 插圖區域 -->
            <div class="illustration-box" id="result-illustration"></div>
            
            <div class="result-title" id="result-title"></div>
            <div class="result-discipline" id="result-discipline"></div>
            <div class="result-desc" id="result-desc"></div>
            <div class="highlight-box" id="result-highlight"></div>
        </div>
        <br>
        <button class="btn" onclick="location.reload()" style="margin-top: 10px;">再測一次 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "Q1. 放學時，你同班朋友去旺角食飯。出地鐵站嗰陣，突然發現其中一個朋友唔見咗，電話又無人聽。呢個時候，你第一時間會點做？",
            options: [
                { id: "A", text: "主動安撫其他慌張嘅朋友，並提議去大家最常去嘅幾間店舖搵下，用溫暖同細心令大家冷靜落嚟。" },
                { id: "B", text: "叫大家留喺原地唔好亂走，自己立刻行去地鐵站客務中心，請職員廣播，並喺腦海迅速規劃最有效率嘅搵人路線。" },
                { id: "C", text: "開啟手機嘅「尋找朋友」或檢查邊個最後見過佢，計算時間同距離，推測佢最有可能卡喺邊個轉車站。" },
                { id: "D", text: "觀察地鐵站出口嘅人流方向同地圖，分析呢個站嘅人流盲點，判斷佢係咪行錯咗去其他連接商場嘅出口。" }
            ]
        },
        {
            text: "Q2. 學校年園遊會(School Bazaar)輪到你哋班擺攤位，大家推舉你做核心負責人。你最想負責以下邊個工作崗位？",
            options: [
                { id: "A", text: "攤位前線嘅接待員兼PR！著起班衫，用最親切嘅笑容同叫座力吸引全校師生過嚟幫襯，確保每位顧客都玩得開心。" },
                { id: "B", text: "現場總指揮！負責監督排隊人流、控制遊戲器材有冇故障，隨時處理現場突發情況(例如有人打尖或倒瀉飛排)。" },
                { id: "C", text: "後勤及物資採購官！精準計算要買幾多原材料、搵邊間批發最平、貨物點樣最快運到學校，確保攤位絕對唔會斷貨。" },
                { id: "D", text: "攤位總策劃師！負責研究全校攤位嘅分佈圖，分析邊個位置最好人流、設計最吸睛嘅攤位主題同長遠嘅宣傳策略。" }
            ]
        },
        {
            text: "Q3. 暑假你同屋企人或者朋友去海外自由行，由你負責編排全個行程。你嘅「排行程風格」最接近以下邊一種？",
            options: [
                { id: "A", text: "精選當地最熱門嘅打卡 Cafe、米芝蓮餐廳或者精緻體驗活動，確保同行嘅所有人行程中都覺得被照顧得無微不至。" },
                { id: "B", text: "行程唔使太密，但每個景點之間嘅「交通接駁時間」一定要預留後備方案(例如萬一班車遲到點辦)，確保行程極度流暢。" },
                { id: "C", text: "行程路線絕對唔走回頭路！精確計算行李箱限重、買手信嘅寄送方法，用最短嘅行車/行路路線去到最多目的地。" },
                { id: "D", text: "比起普通景點，更想去體驗當地獨特嘅交通工具(如雙層巴士、新幹線、纜車)，觀察人哋嘅城市同交通網絡點解規劃得咁好。" }
            ]
        },
        {
            text: "Q4. 距離 JUPAS/E-App 選科截止仲有最後一日，你發現自己仲有3個學分/選修志願未填滿，此時你對未來大學生活最大嘅期望係乜？",
            options: [
                { id: "A", text: "希望修讀有得著專業制服、著重人際溝通、畢業後可以直接接觸世界各地不同文化旅客嘅實用學科。" },
                { id: "B", text: "希望學習點樣管理一個大型國際地標(如世界級機場)嘅運作，享受喺幕後掌控全盤大局、指揮若定嘅成功感。" },
                { id: "C", text: "希望掌握網購、全球物資流轉背後嘅高科技大數據商務知識，畢業後加入高薪、高前途嘅國際物流管理行業。" },
                { id: "D", text: "希望擁有最廣闊嘅視野，研究全球交通運輸體系、航空公司管理與航空政策，成為未來交通界嘅策略與規劃人才。" }
            ]
        }
    ];

    const resultsData = {
        "A": {
            illustration: "👩‍✈️ ☕ ✨",
            title: "【空服極限 Carry 俠】",
            discipline: "(航空機艙及客運服務)",
            desc: "天生具備神級的情商(EQ)與讀心術！就算遇到瘋狂投訴的奧客，你都能面帶微笑、優雅地用一杯熱茶化解危機。在空中飛行的世界裡，你就是全機乘客的安全感來源。",
            highlight: "💡 Programme Code: BA114057\n想體驗模擬機艙實習？這科就是你的首選！(請參考課程 QR 碼)"
        },
        "B": {
            illustration: "🏢 🎧 🧠",
            title: "【上帝視角：塔台指揮官】",
            discipline: "(機場營運管理)",
            desc: "天生自帶超強大腦與抗壓能力！擅長在混亂中理出頭緒，就算機場有 100 班航機同時起降、天氣突變，你都能冷靜調度。你是掌控整個機場運作的核心大腦。",
            highlight: "💡 Programme Code: BA114107\n想學習世界級機場的營運與危機處理？來這裡就對了。(請參考課程 QR 碼)"
        },
        "C": {
            illustration: "📦 🌍 🚚",
            title: "【環球物資傳送門】",
            discipline: "(航空及物流)",
            desc: "擁有最強的空間感與時間管理能力！網購的iPhone 點樣最快由工廠送到你手上？疫苗點樣在低溫下安全跨國運送？全靠你的精準計算。你是鏈接全球經濟的幕後黑手。",
            highlight: "💡 Programme Code: BA114056\n結合大數據與全球供應鏈，是全港極缺人才的高薪行業！(請參考課程 QR 碼)"
        },
        "D": {
            illustration: "🗺️ 🚅 🏙️",
            title: "【未來交通規劃大師】",
            discipline: "(航空服務及運輸學)",
            desc: "充滿好奇心與宏觀視野的策略家。比起單一崗位，你更喜歡研究整條航線、公共交通網絡的規劃。高瞻遠矚，未來的航空政策與運輸大局將由你來改寫！",
            highlight: "💡 Programme Code: BA114058\n出路最廣闊，涵蓋航空諮詢、政府運輸部門及大型交通機構。(請參考課程 QR 碼)"
        }
    };

    let currentQuestionIndex = 0;
    let answers = [];

    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        // 稍微延遲以確保動畫重新觸發
        setTimeout(() => {
            document.getElementById(id).classList.add('active');
        }, 50);
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        answers = [];
        showSection('quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('question-progress').innerText = `🚩 任務進度： ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 

        q.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt.text;
            // 綁定點擊事件，傳入選項 ID 與被點擊的元素本身
            btn.onclick = function() { selectOption(opt.id, this); };
            optionsContainer.appendChild(btn);
        });
    }

    // 加入延遲與過場動畫的選項點擊函數
    function selectOption(id, element) {
        // 如果已經有選項被選中（動畫進行中），則忽略點擊，防止連點出錯
        if (document.querySelector('.option.selected')) return;

        // 加上 selected 類別，觸發反白的 CSS 動畫
        element.classList.add('selected');
        answers.push(id);

        // 停頓 0.7 秒讓使用者看清楚自己選了什麼
        setTimeout(() => {
            const quizSection = document.getElementById('quiz');
            // 整個題目區塊淡出
            quizSection.classList.add('fade-out');

            // 等待淡出動畫(0.4秒)完成後，換題並淡入
            setTimeout(() => {
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion();
                    quizSection.classList.remove('fade-out');
                } else {
                    quizSection.classList.remove('fade-out');
                    calculateResult();
                }
            }, 400);

        }, 700);
    }

    function calculateResult() {
        const counts = answers.reduce((acc, val) => {
            acc[val] = (acc[val] || 0) + 1;
            return acc;
        }, {});

        let maxCount = 0;
        let finalResultId = 'A';

        for (const [key, value] of Object.entries(counts)) {
            if (value > maxCount) {
                maxCount = value;
                finalResultId = key;
            }
        }
        renderResult(finalResultId);
    }

    function renderResult(id) {
        const resultData = resultsData[id];
        document.getElementById('result-illustration').innerText = resultData.illustration;
        document.getElementById('result-title').innerText = resultData.title;
        document.getElementById('result-discipline').innerText = resultData.discipline;
        document.getElementById('result-desc').innerText = resultData.desc;
        document.getElementById('result-highlight').innerText = resultData.highlight;
        
        showSection('result');
    }
</script>

</body>
</html>
